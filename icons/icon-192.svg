<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    
    <!-- Teal Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    
    <!-- Gold/Amber Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    
    <!-- Radial Glow Behind Logo -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Drop Shadow for Logo Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.06"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.04"/>

  <!-- Radial Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Main Logo Mark Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Book/Shield Base -->
    <!-- Left Page -->
    <path d="M 256,380 L 160,320 L 160,230 L 256,290 Z" fill="url(#primaryGrad)"/>
    <!-- Right Page -->
    <path d="M 256,380 L 352,320 L 352,230 L 256,290 Z" fill="url(#secondaryGrad)"/>
    
    <!-- Book Lines (Pages Details) -->
    <!-- Left Page Lines -->
    <path d="M 180,265 L 236,300 M 180,295 L 236,330" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.25"/>
    <!-- Right Page Lines -->
    <path d="M 276,300 L 332,265 M 276,330 L 332,295" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.25"/>
    
    <!-- Cap Skull Base (head band under mortarboard) -->
    <path d="M 210,165 L 210,185 Q 256,215 302,185 L 302,165 Q 256,180 210,165 Z" fill="#0b1220" opacity="0.8"/>
    <path d="M 210,185 Q 256,215 302,185" stroke="url(#primaryGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Mortarboard (Cap Diamond Top) -->
    <path d="M 256,95 L 386,145 L 256,195 L 126,145 Z" fill="url(#primaryGrad)"/>
    <!-- Top Mortarboard Highlight Edge -->
    <path d="M 126,145 L 256,95 L 386,145" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
    
    <!-- Tassel -->
    <!-- Hanging String -->
    <path d="M 256,145 Q 310,160 326,190" stroke="url(#goldGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Tassel Ring/Band -->
    <circle cx="326" cy="192" r="4.5" fill="#f59e0b"/>
    <!-- Tassel Brush -->
    <path d="M 326,192 L 326,220" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Dynamic Checkmark Shadow -->
    <path d="M 198,289 L 242,333 L 326,209" fill="none" stroke="#000000" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

    <!-- Dynamic Checkmark (Takip Symbol) -->
    <path d="M 198,285 L 242,329 L 326,205" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Star of Excellence -->
    <path d="M 380,95 L 383,103 L 391,103 L 385,108 L 387,116 L 380,111 L 373,116 L 375,108 L 369,103 L 377,103 Z" fill="url(#goldGrad)"/>

  </g>
</svg>
